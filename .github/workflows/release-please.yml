name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          # Default GITHUB_TOKEN tag pushes don't trigger the release
          # workflow. Set a PAT as RELEASE_PLEASE_TOKEN to fix; falls back
          # to GITHUB_TOKEN (then dispatch the release workflow manually).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
